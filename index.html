
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Müşteri Demo Sitesi</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #10131c;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 24px;
    }

    .card {
      max-width: 600px;
    }

    h1 {
      font-size: clamp(36px, 8vw, 60px);
      margin-bottom: 16px;
    }

    p {
      color: #bdc4d4;
      line-height: 1.7;
    }

    a {
      display: inline-block;
      margin-top: 20px;
      padding: 14px 24px;
      border-radius: 10px;
      background: #7357ff;
      color: white;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main class="card">
    <p>İŞLETMENİZ İÇİN YENİ BİR BAŞLANGIÇ</p>
    <h1>Hayalinizdeki web sitesine hoş geldiniz.</h1>
    <p>
      Markanızı dijital dünyaya taşıyan modern
      ve özgün bir deneyim.
    </p>
    <a href="https://www.google.com/" target="_blank"
       rel="noopener noreferrer">Daha fazlasını keşfet</a>
  </main>
</body>
</html>
